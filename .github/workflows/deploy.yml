name: Deploy SafeKid to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package source snapshot for local testing
        run: |
          zip -qr "${RUNNER_TEMP}/SafeKid-main-source.zip" . \
            -x ".git/*" "node_modules/*" "dist/*" "coverage/*" ".env" ".env.*"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: SafeKid-main-source
          path: ${{ runner.temp }}/SafeKid-main-source.zip
          retention-days: 7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
