name: Deploy SafeKid to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The source archive is a one-time transport bundle used to apply the
      # Claude ZIP changes through GitHub itself. The resulting files are
      # committed to main before the production build in this same run.
      - name: Apply source migration bundle
        if: ${{ hashFiles('source-migration/parts/*.txt') != '' }}
        run: |
          cat source-migration/parts/*.txt | tr -d '\n' > /tmp/safekid-source.b64
          base64 --decode /tmp/safekid-source.b64 > /tmp/safekid-source.tar.gz
          tar -xzf /tmp/safekid-source.tar.gz -C .
          rm -rf source-migration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Claude motion overhaul and GitHub Pages fixes"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
